<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Planner Navigation</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Inter, Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #1f2937;
    }

    /* =========================
       NAVIGATION CONTAINER
       ========================= */

    .teacher-nav {
        width: 100%;
        max-width: 1200px;
        margin: 30px auto;
        padding: 14px 18px;

        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;

        box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }

    /* =========================
       BRAND
       ========================= */

    .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 8px 12px 14px;
        margin-bottom: 10px;

        border-bottom: 1px solid #eeeeee;
    }

    .brand-icon {
        width: 38px;
        height: 38px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;
        background: #f3f4f6;
    }

    .brand-icon svg {
        width: 21px;
        height: 21px;
    }

    .brand-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.2px;
    }

    .brand-subtitle {
        font-size: 11px;
        color: #8b95a5;
        margin-top: 2px;
    }

    /* =========================
       NAVIGATION
       ========================= */

    .nav-items {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;

        scrollbar-width: none;
    }

    .nav-items::-webkit-scrollbar {
        display: none;
    }

    .nav-item {
        position: relative;

        display: flex;
        align-items: center;
        gap: 8px;

        padding: 10px 13px;

        text-decoration: none;
        color: #4b5563;

        font-size: 13px;
        font-weight: 500;

        border-radius: 11px;

        white-space: nowrap;

        transition:
            background 0.2s ease,
            color 0.2s ease,
            transform 0.2s ease;
    }

    .nav-item svg {
        width: 18px;
        height: 18px;

        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;

        flex-shrink: 0;
    }

    .nav-item:hover {
        background: #f5f7fa;
        color: #111827;
        transform: translateY(-1px);
    }

    /* Active item */

    .nav-item.active {
        background: #eef2f7;
        color: #111827;
        font-weight: 650;
    }

    .nav-item.active::after {
        content: "";

        position: absolute;
        bottom: 3px;
        left: 50%;

        width: 4px;
        height: 4px;

        border-radius: 50%;
        background: #374151;

        transform: translateX(-50%);
    }

    /* =========================
       SEPARATOR
       ========================= */

    .nav-separator {
        width: 1px;
        height: 25px;
        background: #e5e7eb;
        margin: 0 3px;
        flex-shrink: 0;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

        .teacher-nav {
            margin: 15px;
            padding: 12px;
            border-radius: 15px;
        }

        .brand-title {
            font-size: 16px;
        }

        .nav-items {
            gap: 3px;
        }

        .nav-item {
            padding: 9px 11px;
            font-size: 12px;
        }

        .nav-item svg {
            width: 16px;
            height: 16px;
        }
    }

</style>
</head>
