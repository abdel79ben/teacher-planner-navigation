<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Planner Section Navigation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 8px 0;
    background: transparent;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    color: #26332F;
}

/* =========================
   NAVIGATION CONTAINER
========================= */

.section-nav {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;

    display: flex;
    align-items: center;
    gap: 4px;

    padding: 7px;

    background: #FCFBF8;
    border: 1px solid #DCE8E1;
    border-radius: 14px;

    overflow-x: auto;
    white-space: nowrap;

    scrollbar-width: none;
}

.section-nav::-webkit-scrollbar {
    display: none;
}

/* =========================
   SECTION LABEL
========================= */

.section-label {
    display: inline-flex;
    align-items: center;

    padding: 0 10px;
    margin-right: 2px;

    color: #4F6F64;

    font-size: 11px;
    font-weight: 600;

    letter-spacing: 0.05em;
    text-transform: uppercase;

    flex-shrink: 0;
}

/* =========================
   NAVIGATION LINKS
========================= */

.nav-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    min-height: 38px;

    padding: 8px 13px;

    color: #64746E;
    text-decoration: none;

    border-radius: 10px;

    font-size: 13px;
    font-weight: 500;

    transition:
        background 0.18s ease,
        color 0.18s ease;

    flex-shrink: 0;
}

.nav-link:hover {
    background: #EAF2EE;
    color: #4F6F64;
}

/* ACTIVE PAGE */

.nav-link.active {
    background: #EAF2EE;
    color: #4F6F64;
    font-weight: 600;
}

/* =========================
   ICONS
========================= */

.nav-link svg {
    width: 18px;
    height: 18px;

    flex: 0 0 auto;

    stroke: currentColor;
    stroke-width: 1.9;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   DIVIDERS
========================= */

.divider {
    width: 1px;
    height: 22px;

    background: #DCE8E1;

    flex: 0 0 auto;

    margin: 0 2px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .section-nav {
        border-radius: 11px;
    }

    .section-label {
        display: none;
    }

    .nav-link {
        padding: 8px 11px;
        font-size: 12px;
    }

    .nav-link svg {
        width: 17px;
        height: 17px;
    }
}
</style>
</head>

<body>

<div id="navigation"></div>

<script>

/* ==========================================
   SECTION DEFINITIONS
========================================== */

const sections = {

    teach: {
        title: "Teach & Assess",
        items: [
            "subjects",
            "curriculum",
            "lessons",
            "assignments",
            "tasks",
            "assessments",
            "resources"
        ]
    },

    plan: {
        title: "Plan & Organize",
        items: [
            "students",
            "classes",
            "timetable",
            "attendance"
        ]
    },

    review: {
        title: "Review & Reflect",
        items: [
            "events",
            "daily",
            "goals",
            "progress"
        ]
    }

};


/* ==========================================
   READ URL PARAMETERS
========================================== */

const params = new URLSearchParams(window.location.search);

const sectionKey =
    params.get("section") || "teach";

const activeKey =
    params.get("active") || "lessons";


/* ==========================================
   SELECT SECTION
========================================== */

const section =
    sections[sectionKey] || sections.teach;


/* ==========================================
   BUILD NAVIGATION
========================================== */

document.getElementById("navigation").innerHTML = `

<nav class="section-nav"
     aria-label="${section.title}">

    <span class="section-label">
        ${section.title}
    </span>

    ${section.items.map((key, index) => `

        ${index > 0
            ? '<span class="divider"></span>'
            : ''
        }

        <a
            class="nav-link ${key === activeKey ? 'active' : ''}"
            href="${pages[key].url}"
            target="_top"
            rel="noopener"
        >

            ${pages[key].icon}

            <span>
                ${pages[key].label}
            </span>

        </a>

    `).join("")}

</nav>

`;

</script>
