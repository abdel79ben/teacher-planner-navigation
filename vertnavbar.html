<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Planner Sidebar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        Helvetica,
        Arial,
        sans-serif;

    background: #f7f8fa;
    color: #20242b;
}


/* =================================
   SIDEBAR
   ================================= */

.sidebar {

    width: 285px;
    min-height: 100vh;

    padding: 24px 18px;

    background: #ffffff;

    border-right: 1px solid #e6e8ec;

    overflow-y: auto;
}


/* =================================
   BRAND
   ================================= */

.brand {

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 8px 10px 22px;

    margin-bottom: 8px;

    border-bottom: 1px solid #eceef1;
}

.brand-icon {

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f1f3f6;

    border-radius: 12px;
}

.brand-icon svg {

    width: 23px;
    height: 23px;

    stroke: #374151;

    fill: none;

    stroke-width: 1.8;
}

.brand-title {

    font-size: 17px;

    font-weight: 700;

    color: #20242b;
}

.brand-subtitle {

    margin-top: 3px;

    font-size: 11px;

    color: #9299a5;
}


/* =================================
   SECTION
   ================================= */

.section {

    margin-top: 24px;
}

.section-title {

    display: flex;
    align-items: center;

    gap: 9px;

    padding: 0 10px 8px;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: .5px;

    text-transform: uppercase;

    color: #8a919d;
}

.section-title svg {

    width: 16px;
    height: 16px;

    stroke: #737b88;

    fill: none;

    stroke-width: 1.7;
}


/* =================================
   NAV ITEMS
   ================================= */

.nav-list {

    display: flex;

    flex-direction: column;

    gap: 2px;
}

.nav-item {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 11px;

    border-radius: 10px;

    text-decoration: none;

    color: #4b5563;

    font-size: 14px;

    font-weight: 500;

    transition: all .18s ease;
}

.nav-item svg {

    width: 19px;
    height: 19px;

    flex-shrink: 0;

    stroke: currentColor;

    fill: none;

    stroke-width: 1.7;
}

.nav-item:hover {

    background: #f4f6f8;

    color: #20242b;

    transform: translateX(2px);
}


/* ACTIVE */

.nav-item.active {

    background: #eef1f5;

    color: #20242b;

    font-weight: 650;
}

.nav-item.active svg {

    stroke-width: 2;
}


/* =================================
   DIVIDER
   ================================= */

.divider {

    height: 1px;

    background: #eceef1;

    margin: 14px 10px;
}


/* =================================
   QUICK ACTIONS
   ================================= */

.quick-actions {

    margin-top: 26px;

    padding: 16px;

    border: 1px solid #e6e8ec;

    border-radius: 14px;

    background: #fafbfc;
}

.quick-title {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 12px;

    font-size: 13px;

    font-weight: 700;

    color: #454c57;
}

.quick-title svg {

    width: 17px;
    height: 17px;

    stroke: #555e6b;

    fill: none;

    stroke-width: 1.8;
}


/* QUICK BUTTON */

.quick-button {

    display: flex;

    align-items: center;

    gap: 9px;

    width: 100%;

    padding: 8px 9px;

    margin-bottom: 3px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #59616d;

    font-size: 12.5px;

    font-family: inherit;

    text-align: left;

    cursor: pointer;

    transition: all .18s ease;
}

.quick-button:hover {

    background: #eef1f4;

    color: #20242b;
}

.quick-button svg {

    width: 17px;
    height: 17px;

    stroke: currentColor;

    fill: none;

    stroke-width: 1.7;
}


/* =================================
   MOBILE
   ================================= */

@media (max-width: 700px) {

    .sidebar {

        width: 250px;

        padding: 18px 14px;
    }

    .nav-item {

        font-size: 13px;

        padding: 9px;
    }

    .section {

        margin-top: 20px;
    }
}

</style>
</head>
